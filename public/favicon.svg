<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
    <linearGradient id="pencilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>

  <!-- Borde de acento -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#accentG)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Red digital sutil -->
  <path d="M12 22h40M12 32h40M12 42h40M22 12v40M32 12v40M42 12v40" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Lápiz Estilizado -->
  <g transform="rotate(-45 32 32)">
    <!-- Cuerpo del Lápiz -->
    <rect x="28" y="16" width="8" height="28" fill="url(#pencilBody)" rx="1"/>
    <line x1="32" y1="16" x2="32" y2="44" stroke="#94a3b8" stroke-width="0.8"/>
    
    <!-- Borrador -->
    <rect x="28" y="12" width="8" height="4" fill="url(#accentG)" rx="1"/>
    <rect x="28" y="15" width="8" height="2" fill="#94a3b8"/>

    <!-- Punta -->
    <polygon points="28,44 36,44 32,53" fill="#fbcfe8"/>
    <polygon points="30.5,49.5 33.5,49.5 32,53" fill="url(#accentG)"/>
  </g>

  <!-- Destello Digital -->
  <circle cx="48" cy="16" r="2.5" fill="url(#accentG)"/>
  <path d="M48 10v3M48 19v3M42 16h3M51 16h3" stroke="url(#accentG)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
